<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <img id="src" src="icon-src.png" style="display: none" />
    <script>
      ;(async () => {
        try {
          const img = document.getElementById('src')
          await img.decode()
          const S = 1024
          const c = document.createElement('canvas')
          c.width = S
          c.height = S
          const ctx = c.getContext('2d')
          ctx.drawImage(img, 0, 0)
          // 垂直镜像补丁：取样水印上方干净条带，翻转后覆盖右下角水印区域，渐变无缝衔接
          const px = 830
          const pw = S - px
          const bandY = 845
          const bandH = 90
          ctx.save()
          ctx.translate(px, bandY + bandH)
          ctx.scale(1, -1)
          ctx.drawImage(img, px, bandY, pw, bandH, 0, -bandH, pw, bandH)
          ctx.restore()
          window.__result = c.toDataURL('image/png')
        } catch (e) {
          window.__err = String(e)
        }
      })()
    </script>
  </body>
</html>
